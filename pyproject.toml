[project]
name = "ige"
version = "0.1.0"
description = "Human interventions as labels: localizing, steering and editing the computations behind LLM agent failures"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "transformer-lens>=2.7",
    "transformers>=4.44",
    "safetensors>=0.4",
    "hydra-core>=1.3",
    "numpy>=1.26",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# NOTE: vllm is NOT an extra here on purpose — it lives in a separate venv on
# the GPU machine (generation service only); its pins routinely conflict with
# the interpretability stack. See scripts/setup_gpu_host.sh.
gpu = [
    "bitsandbytes>=0.44",
    "peft>=0.13",
]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.6",
    "matplotlib>=3.8",   # scripts/make_figures.py and the tutorial's --plot
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ige"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, deterministic, CPU-only",
    "integration: end-to-end on a tiny real model (gpt2-small/pythia); GPU if available",
    "canary: negative controls that MUST fail-to-find (run inside experiments)",
    "gpu: requires a CUDA device",
]

[tool.ruff]
line-length = 100
target-version = "py311"
