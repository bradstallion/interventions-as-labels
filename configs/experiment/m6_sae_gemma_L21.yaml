# M6-SAE (predictions written down in advance in experiments/m6_sae/PREDICTIONS.md): Gemma Scope at gemma's
# causal peak (L21). Blocking gate T0 on the PT->IT transfer.
kind: sae_overask
seed: 0
records: store/derived/m2_collect_gemma2b_bf16_conv/records.jsonl
model:
  name: google/gemma-2-2b-it
  device: auto
  dtype: bfloat16
  # raw HF basis: Gemma Scope SAEs are trained on unprocessed activations;
  # with TransformerLens weight preprocessing the T0 gate fails (FVU 8.65, healthy L0 46)
  no_processing: true
sae:
  repo: google/gemma-scope-2b-pt-res
  layer: 21
  width: 16k
style_n: 40
support_k: 50
arm_k: 10
out: store/derived/m6_sae_gemma_L21
