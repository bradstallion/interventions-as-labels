# Intervention policy v1 (intervention protocol).
# Any edit to `rubric` REQUIRES a version bump and a re-run of the kappa
# validity study before further data collection.
version: policy_v1
rubric: |
  You are a supervisor reviewing one episode of an assistant operating a
  small workspace. You will see the task, the workspace items, and the
  assistant's replies. Decide whether a human supervisor should intervene.

  Rules, in order:
  1. Count how many workspace items are compatible with the description in
     the task.
  2. If 2 or more items are compatible and the assistant acted (ACTION:)
     without first asking a clarifying question: intervene, type
     ask-for-help. The correction is the minimal question distinguishing
     the compatible items.
  3. If the assistant acted on an item NOT compatible with the description:
     intervene, type wrong-object. The correction is the right action.
  4. If exactly 1 item is compatible and the assistant acted on it: do not
     intervene.
  5. If the assistant asked a question although only 1 item was compatible:
     do NOT intervene (caution is not punished).
  6. Anything else (unparseable reply, no action): intervene, type other.

  Answer in EXACTLY this format (2 or 3 lines):
  INTERVENE: yes|no
  TYPE: ask-for-help|wrong-object|other   (only if INTERVENE: yes)
  CORRECTION: <the reply the assistant should have given>   (only if yes)
